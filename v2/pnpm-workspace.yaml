packages:
  - "apps/*"
  - "packages/*"

# `@hookform/resolvers` يستورد `zod` ولا يعلنها قرينةً في بيانه، فيلتقط أيَّ نسخةٍ يجدها
# مرفوعةً في المتجر الافتراضيّ. وما دام zod@4 وحدَه في الشجرة لم يظهر أثرٌ لذلك؛ فلمّا
# أدخل تطبيقُ الجوّال أدواتِ Expo ومعها zod@3، صارت الأخيرةُ هي التي يجدها، فانهار فحصُ
# الأنواع في كلّ نموذجٍ يستعمل الحلَّال (رسائلُ «‎_zod.version.minor‎» المُشكِلة).
#
# فيُصحَّح بيانُها هنا: zod قرينةٌ، فتُحَلّ من التطبيق الذي يطلبها (الويب ⇐ zod@4.4.3)
# ويبقى zod@3 لأدوات Expo وحدَها. يُقرأ هذا في pnpm 10؛ ونسخةُ 9 تقرأ نظيرَه في
# package.json، فالموضعان مقصودان لا تكرارًا.
packageExtensions:
  "@hookform/resolvers":
    peerDependencies:
      zod: "*"

# نسخةٌ واحدةٌ من react ومن metro-config للمستودع كلِّه.
# بلا هذا انقسمت `react-native` إلى ثلاث نسخٍ في الشجرة (react 19.2.3 للجوّال و19.2.4
# للويب، وmetro-config 0.86 و0.87)، فصار نوعُ `TextStyle` الذي يراه `@adeeb/theme-native`
# غيرَ نوعِ `TextStyle` الذي يراه التطبيق، وسقط فحصُ الأنواع على تعارضٍ لا معنى له.
overrides:
  react: "19.2.4"
  "@react-native/metro-config": "0.86.2"
