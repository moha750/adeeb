packages:
  - "apps/*"
  - "packages/*"

# `@hookform/resolvers` يستورد `zod` ولا يعلنها قرينةً في بيانه، فيلتقط أيَّ نسخةٍ يجدها
# مرفوعةً في المتجر الافتراضيّ. وما دامت في الشجرة نسخةٌ واحدةٌ لم يظهر أثرٌ لذلك؛ فمتى
# أدخلت أداةٌ نسخةً ثانيةً أقدمَ صارت هي التي يجدها، فانهار فحصُ الأنواع في كلّ نموذجٍ
# يستعمل الحلَّال (رسائلُ «‎_zod.version.minor‎» المُشكِلة).
#
# فيُصحَّح بيانُها هنا: zod قرينةٌ، فتُحَلّ من التطبيق الذي يطلبها. يُقرأ هذا في pnpm 10؛
# ونسخةُ 9 تقرأ نظيرَه في package.json، فالموضعان مقصودان لا تكرارًا.
packageExtensions:
  "@hookform/resolvers":
    peerDependencies:
      zod: "*"

# نسخةٌ واحدةٌ من react للمستودع كلِّه، فلا تنقسم الشجرةُ على نسختين يختلف نوعُهما.
overrides:
  react: "19.2.4"
