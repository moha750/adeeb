<style>
/* VOICE: playful and royal, made for small hands: big targets, few words
   IDEA: a royal dress-up table: a crown on a velvet cushion inside a fairy-tale castle scene
   PICTURE: bevelled metal crown, faceted gems in gold settings, castles with flags, a living sky per world
   COLOUR and TYPE: rose housing with gold accent, each world repaints the scene; El Messiri for titles, Readex Pro for UI
   LAYOUT: scene beside the tray on iPad/laptop, scene above the tray on portrait; the crown button lives on the scene */
:root{color-scheme:light dark;--bg:light-dark(#ffe3ec,#2a0f1e);--ink:light-dark(#4a0f2b,#ffe3ec);--card:light-dark(#fff,#3d1a2c);--soft:light-dark(#fff0f5,#4c2337);--rose:#c2185b;--gold:#f5b700}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.6 "Readex Pro",system-ui,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none}
.app{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(320px,1fr);gap:14px;height:100dvh;padding:14px}
.stage{position:relative;border-radius:28px;overflow:hidden;background:var(--sky2,#ffe3ec);box-shadow:0 10px 30px rgba(120,10,60,.18);transition:box-shadow .2s}
.stage.drop{box-shadow:0 0 0 5px var(--gold),0 10px 30px rgba(120,10,60,.18)}
.stage>svg{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.panel{background:var(--card);border-radius:28px;padding:14px 18px;overflow:auto;display:flex;flex-direction:column;gap:10px;box-shadow:0 10px 30px rgba(120,10,60,.12)}
h1,h2{font-family:"El Messiri",serif;font-weight:700;margin:0;line-height:1.2;color:var(--rose)}
h1{font-size:40px}
.sub{margin:0;font-size:16px;opacity:.75}
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.lbl{font-size:14px;font-weight:600;opacity:.7;margin-bottom:5px}
.row{display:flex;flex-wrap:wrap;gap:7px}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.opt{background:var(--soft);border-radius:16px;padding:5px;display:grid;place-items:center;border:3px solid transparent;transition:transform .15s}
.opt:active{transform:scale(.92)}
.opt[aria-pressed=true]{border-color:var(--rose);background:light-dark(#ffe0ec,#5a2440)}
.world{width:58px;gap:1px;font-size:12px;font-weight:600;line-height:1.3}
.world i{width:36px;height:36px;border-radius:50%;display:block;box-shadow:inset 0 -4px 0 rgba(0,0,0,.12)}
.shape{width:64px;height:54px}.shape svg{width:54px;height:42px}
.metal{width:46px;height:46px;border-radius:50%;padding:0}
.metal i{width:34px;height:34px;border-radius:50%;display:block;box-shadow:inset 0 -5px 0 rgba(0,0,0,.18),inset 0 4px 0 rgba(255,255,255,.6)}
.tray{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.tray button{aspect-ratio:1;background:var(--soft);border-radius:16px;display:grid;place-items:center;transition:transform .12s;touch-action:none}
.tray button:active{transform:scale(.88)}
.tray svg{width:76%;height:76%;overflow:visible;pointer-events:none}
input{font:600 17px "Readex Pro",system-ui,sans-serif;width:100%;height:46px;border-radius:16px;border:2px solid light-dark(#f6c2d6,#6a3550);background:var(--soft);color:var(--ink);padding:0 14px}
.acts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.btn{height:48px;border-radius:16px;background:var(--soft);font-weight:600;font-size:16px}
.sup{background:light-dark(#fff4d1,#4d3a10);color:light-dark(#7d5200,#ffe08a)}
.hallB{display:flex;align-items:center;gap:6px;height:44px;padding:0 14px;border-radius:22px;background:light-dark(#fff4d1,#4d3a10);color:light-dark(#7d5200,#ffe08a);font-weight:700;font-size:15px;flex:none}
.hallB svg{width:22px;height:18px}
.foot{font-size:13px;opacity:.6;text-align:center;margin-top:auto}
.go{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);height:62px;padding:0 44px;border-radius:31px;background:var(--rose);color:#fff;font:700 26px/1 "El Messiri",serif;box-shadow:0 6px 0 #8a0f3f,0 10px 24px rgba(0,0,0,.2);white-space:nowrap;z-index:2}
.go:active{transform:translate(-50%,4px);box-shadow:0 2px 0 #8a0f3f}
.stage.party .go{display:none}
.hint{position:absolute;top:16px;left:50%;transform:translateX(-50%);background:rgba(255,255,255,.88);color:#8a0f3f;font-weight:600;padding:6px 18px;border-radius:18px;white-space:nowrap;pointer-events:none;animation:nod 1.6s ease-in-out infinite}
@keyframes nod{50%{transform:translate(-50%,5px)}}
.ghost{position:fixed;width:88px;height:88px;pointer-events:none;z-index:6;transform:translate(-50%,-62%) scale(1.15);filter:drop-shadow(0 8px 10px rgba(0,0,0,.28))}
.stk{cursor:grab}
.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1) both;transform-box:fill-box;transform-origin:center}
@keyframes pop{0%{transform:scale(0)}100%{transform:scale(1)}}
.tw{animation:tw 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes tw{0%,70%,100%{opacity:0;transform:scale(.2)}82%{opacity:1;transform:scale(1)}}
.star{animation:st 3s ease-in-out infinite}
@keyframes st{50%{opacity:.25}}
.cl{animation:drift 26s ease-in-out infinite alternate}
@keyframes drift{to{transform:translateX(46px)}}
.bounce{animation:bn 1s ease-in-out 2;transform-box:fill-box;transform-origin:50% 100%}
@keyframes bn{0%,100%{transform:translateY(0) scale(1)}40%{transform:translateY(-34px) scale(1.05)}70%{transform:translateY(0) scale(.98)}}
.fx .p{animation:fall var(--d) linear infinite;animation-delay:var(--dl)}
.fx .up{animation-name:rise}
@keyframes fall{from{transform:translate(0,-60px) rotate(0)}to{transform:translate(var(--sw),600px) rotate(300deg)}}
@keyframes rise{from{transform:translate(0,600px)}to{transform:translate(var(--sw),-60px)}}
#rays{opacity:0;transition:opacity .6s}
.stage.party #rays{opacity:.5}
.spin{animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.trail{animation:trail .7s ease-out forwards;transform-box:fill-box;transform-origin:center}
@keyframes trail{to{opacity:0;transform:scale(.2) translateY(-14px)}}
.bin{position:absolute;right:16px;top:16px;width:78px;height:78px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.18);opacity:0;transform:scale(.6);transition:.2s;pointer-events:none;z-index:2}
.bin svg{width:38px;height:38px}
.stage.dragging .bin{opacity:1;transform:scale(1)}
.bin.hot{background:#ffd6e4;transform:scale(1.2)!important}
.fs{position:absolute;left:14px;top:14px;width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.75);display:grid;place-items:center;z-index:2}
.fs svg{width:24px;height:24px}
.win{position:absolute;inset:auto 0 5% 0;display:none;flex-direction:column;align-items:center;gap:10px;text-align:center;pointer-events:none;z-index:2}
.win.on{display:flex}
.win b{display:block;background:#fff;color:var(--rose);font:700 clamp(28px,4.6vw,50px)/1.25 "El Messiri",serif;padding:8px 30px;border-radius:26px;box-shadow:0 8px 0 var(--gold);animation:pop .6s cubic-bezier(.3,1.6,.5,1) both}
.win small{display:block;font-size:17px;font-weight:600;color:#fff;background:rgba(122,10,60,.6);padding:2px 16px;border-radius:14px}
.win .row{pointer-events:auto;justify-content:center}
.win .btn{background:#fff;color:var(--rose);padding:0 22px;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.hall{position:absolute;inset:0;background:light-dark(#fff6fa,#2a0f1e);display:none;flex-direction:column;padding:18px;gap:12px;z-index:4}
.hall.on{display:flex}
.hall header{display:flex;justify-content:space-between;align-items:center;gap:10px}
.hall h2{font-size:32px}
.grid{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;align-content:start}
.grid figure{margin:0;background:var(--card);border-radius:20px;padding:8px;text-align:center;box-shadow:0 4px 12px rgba(120,10,60,.1)}
.grid img{width:100%;aspect-ratio:1;display:block;border-radius:14px;object-fit:cover}
.grid figcaption{font-weight:700;font-size:16px;padding-top:4px}
.empty{grid-column:1/-1;text-align:center;opacity:.7;font-size:18px;padding:40px 0}
#cf{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
#defs{position:absolute;width:0;height:0;overflow:hidden}
@media (max-width:820px),(max-aspect-ratio:1/1){
  body{overflow:auto}
  .app{grid-template-columns:minmax(0,1fr);height:auto;min-height:100dvh}
  .stage{height:58vh;min-height:340px}
  h1{font-size:32px}
  .go{height:54px;font-size:22px;padding:0 32px}
}
@media (prefers-reduced-motion:reduce){.tw,.star,.bounce,.pop,.fx .p,.spin,.trail,.cl,.hint{animation:none}.fx{display:none}}
</style>
</head>
<body>
<svg id="defs" aria-hidden="true"><defs id="dd"></defs></svg>
<div class="app">
  <div class="stage" id="stage">
    <svg id="sv" viewBox="0 0 600 520" preserveAspectRatio="xMidYMid meet" aria-label="التاج">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop id="s1" offset="0"/><stop id="s2" offset="1"/></linearGradient>
        <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop data-m="0" offset="0"/><stop data-m="1" offset=".5"/><stop data-m="2" offset="1"/></linearGradient>
        <linearGradient id="band" x1="0" y1="0" x2="0" y2="1"><stop data-m="1" offset="0"/><stop data-m="2" offset=".55"/><stop data-m="1" offset="1"/></linearGradient>
        <radialGradient id="ball" cx=".35" cy=".3" r=".75"><stop data-m="0" offset="0"/><stop data-m="1" offset=".5"/><stop data-m="2" offset="1"/></radialGradient>
        <linearGradient id="side" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity=".22"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".16"/></linearGradient>
        <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".7"/><stop offset=".32" stop-color="#fff" stop-opacity="0"/></linearGradient>
        <radialGradient id="glowG"><stop offset="0" stop-color="#fff" stop-opacity=".6"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
        <radialGradient id="pil" cx=".4" cy=".3" r=".8"><stop id="pl1" offset="0"/><stop id="pl2" offset="1"/></radialGradient>
        <clipPath id="cb"><path id="cbp"/></clipPath>
      </defs>
      <rect x="-600" y="-400" width="1800" height="1400" fill="url(#sky)"/>
      <g id="sun"></g>
      <g id="stars"></g>
      <g id="clouds"></g>
      <g id="castles"></g>
      <g id="hills"></g>
      <circle cx="300" cy="250" r="240" fill="url(#glowG)"/>

      <g class="fx" id="fx"></g>
      <g id="pillow"></g>
      <ellipse cx="300" cy="372" rx="196" ry="13" fill="#000" opacity=".22"/>
      <g id="crown">
        <path id="body" stroke-width="5" stroke-linejoin="round" fill="url(#metal)"/>
        <path id="bodySide" fill="url(#side)"/>
        <path id="bev" fill="none" stroke-width="16" opacity=".5" clip-path="url(#cb)"/>
        <path id="bodyShine" fill="url(#shine)" opacity=".55"/>
        <path id="deco" fill="none" stroke-width="5" stroke-linecap="round" opacity=".45"/>
        <g id="eng"></g>
        <g id="tips"></g>
        <rect x="118" y="295" width="364" height="72" rx="16" fill="url(#band)" stroke-width="5" id="bandR"/>
        <rect x="128" y="304" width="344" height="54" rx="10" fill="none" stroke-width="2" opacity=".55" id="bandIn"/>
        <g id="dots"></g>
        <text id="nm" x="300" y="345" text-anchor="middle" direction="rtl" font-family="El Messiri, serif" font-weight="700" font-size="32"></text>
        <g id="layer"></g>
        <g id="trail"></g>
      </g>
    </svg>
    <div class="hint" id="hint">اسحب زينة إلى التاج</div>
    <button class="fs" id="fs" aria-label="ملء الشاشة"><svg viewBox="0 0 24 24" fill="none" stroke="#b0164f" stroke-width="2.6" stroke-linecap="round"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg></button>
    <div class="bin" id="bin" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#c2185b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6"/></svg></div>
    <button class="go" id="go">تتويج ✦</button>
    <div class="hall" id="hall"><header><h2>قاعة التيجان</h2><div class="row"><button class="btn sup" id="post" style="padding:0 18px">صورة البوست</button><button class="btn" id="hallX" style="padding:0 22px">رجوع</button></div></header><div class="grid" id="grid"></div></div>
    <div class="win" id="win"><b id="winT">مبروك التتويج!</b><small id="winN"></small>
      <div class="row"><button class="btn" id="more">أكمل التزيين</button><button class="btn" id="fresh">تاج جديد</button></div>
    </div>
  </div>
  <div class="panel">
    <div class="head"><div><h1>صمّم تاجك</h1><p class="sub">اختر، زيّن، وتوّج!</p></div><button class="hallB" id="hallB" aria-label="قاعة التيجان"><svg viewBox="100 60 400 320"><path d="M124 305 L124 180 L168 250 L212 150 L256 250 L300 112 L344 250 L388 150 L432 250 L476 180 L476 305Z" fill="#f5b700" stroke="#7d5200" stroke-width="16" stroke-linejoin="round"/><rect x="118" y="295" width="364" height="72" rx="16" fill="#c98a00" stroke="#7d5200" stroke-width="16"/></svg><span id="cnt">٠</span></button></div>
    <div><div class="lbl">القصر</div><div class="row" id="worlds"></div></div>
    <div><div class="lbl">شكل التاج</div><div class="row" id="shapes"></div></div>
    <div><div class="lbl">اللون</div><div class="row" id="metals"></div></div>
    <div><div class="lbl">الزينة: اسحبها إلى التاج، والمسها لتكبر</div><div class="tray" id="tray"></div></div>
    <div><div class="lbl">اسمك على التاج</div><input id="name" maxlength="12" placeholder="اكتب اسمك" autocomplete="off"></div>

    <div class="foot">برمجة وتشغيل: نادي أدِيب</div>
  </div>

<script>
{
const $=id=>document.getElementById(id);
const NS='http://www.w3.org/2000/svg';
const WORLDS=[
  {n:'الوردة',s1:'#ff9fc2',s2:'#ffe6ef',c:'#f7a8c6',cs:'#e483a8',r:'#c2185b',h1:'#ffd3e2',h2:'#ffbfd5',p1:'#9c1248',p2:'#e04a86',st:.3,fx:'petal',cl:1,sun:'day'},
  {n:'الجليد',s1:'#78c4ef',s2:'#eaf8ff',c:'#c4e8fa',cs:'#93cde9',r:'#3f86c8',h1:'#ffffff',h2:'#e2f3fc',p1:'#1f5a94',p2:'#4b93d1',st:.5,fx:'snow',cl:1,sun:'day'},
  {n:'البحر',s1:'#0f97a8',s2:'#a8ece2',c:'#72d4c9',cs:'#47b3a9',r:'#f27a5e',h1:'#f6e3b4',h2:'#ead096',p1:'#0b5f68',p2:'#1b9aa3',st:.3,fx:'bubble',cl:0,sun:'day'},
  {n:'النجوم',s1:'#0c1c45',s2:'#34539a',c:'#2c4b8c',cs:'#1f3870',r:'#f5b700',h1:'#1c3467',h2:'#25417c',p1:'#9c1248',p2:'#e04a86',st:1,fx:'spark',cl:0,sun:'moon'},
  {n:'الحديقة',s1:'#8fd8ff',s2:'#effbf2',c:'#ffd3e4',cs:'#f2abc8',r:'#e0306f',h1:'#a9e48d',h2:'#8fd673',p1:'#9c1248',p2:'#e04a86',st:.2,fx:'leaf',cl:1,sun:'day'},
  {n:'الغروب',s1:'#ff8a6b',s2:'#ffe2aa',c:'#ec92a6',cs:'#cc6c84',r:'#7a1f4a',h1:'#f9c995',h2:'#f1b47b',p1:'#6e1b43',p2:'#a8336a',st:.4,fx:'lantern',cl:1,sun:'set'}
];
const METALS=[
  {n:'ذهبي',c:['#fff4b8','#f5c518','#c98a00'],d:'#7d5200'},
  {n:'فضي',c:['#ffffff','#d5dbe3','#929caa'],d:'#56606c'},
  {n:'وردي ذهبي',c:['#ffe3d9','#f0a58f','#c46c57'],d:'#7f3f30'},
  {n:'وردي',c:['#ffd9ec','#ff7eb6','#d6337a'],d:'#86174a'},
  {n:'سماوي',c:['#e9fcff','#8edcf5','#3aa3cf'],d:'#1c5f80'},
  {n:'بنفسجي',c:['#f0e6ff','#b892ff','#7b52d6'],d:'#45288a'},
  {n:'زمردي',c:['#dcffeb','#52d18e','#169a5b'],d:'#0b5a34'}
];
// crown shapes
const petals=pk=>{let d='M124 305 V236';pk.forEach(([x0,xp,yp,x1])=>{const w=x1-x0;d+=` C${x0+w*.42} 236 ${xp} ${yp+46} ${xp} ${yp} C${xp} ${yp+46} ${x1-w*.42} 236 ${x1} 236`});return d+' V305Z'};
const PK=[[124,157,170,190],[190,223,205,256],[256,300,104,344],[344,377,205,410],[410,443,170,476]];
const SHAPES=[
  {d:'M124 305 L124 180 L168 250 L212 150 L256 250 L300 112 L344 250 L388 150 L432 250 L476 180 L476 305Z',t:[[124,180],[212,150],[300,112],[388,150],[476,180]],tr:12,e:[[212,218],[300,196],[388,218]],x:''},
  {d:'M118 305 C130 220 200 165 258 145 C272 112 286 96 300 78 C314 96 328 112 342 145 C400 165 470 220 482 305Z',t:[[300,74]],tr:14,e:[[300,140],[214,232],[386,232]],x:'M158 298 C176 236 232 200 300 192 C368 200 424 236 442 298'},
  {d:'M124 305 V215 Q168 150 212 215 Q256 118 300 118 Q344 118 388 215 Q432 150 476 215 V305Z',t:[[168,178],[300,104],[432,178]],tr:12,e:[[168,246],[300,176],[432,246]],x:'M212 215 Q256 165 300 165 Q344 165 388 215'},
  {d:'M124 305 V205 C124 140 210 112 300 110 C390 112 476 140 476 205 V305Z',t:[[300,90]],tr:18,e:[[170,250],[300,200],[430,250]],x:'M214 292 C214 200 252 140 300 116 M386 292 C386 200 348 140 300 116 M300 116 V160'},
  {d:petals(PK),t:PK.map(p=>[p[1],p[2]]),tr:9,e:[[157,252],[300,190],[443,252]],x:''}
];
const SLOTS=[[300,215],[212,238],[388,238],[160,262],[440,262],[256,190],[344,190],[150,331],[450,331],[300,268],[200,331],[400,331]];
// ---------- stickers ----------
const P=(r,a)=>(Math.cos(a*Math.PI/180)*r).toFixed(1)+','+(Math.sin(a*Math.PI/180)*r).toFixed(1);

function ac(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume()}catch(_){actx=null}return actx}
function tone(f,t0,d,type='triangle',v=.18){const a=actx;if(!a||a.state!=='running')return;const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;const t=a.currentTime+t0;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.02);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.05)}

const idbPut=o=>new Promise(res=>{try{const tx=db.transaction('crowns','readwrite');const q=tx.objectStore('crowns').put(o);q.onsuccess=()=>{o.id=q.result;res(o)};q.onerror=()=>res(o)}catch(_){res(o)}});

    const cols=n<=1?1:n<=4?2:n<=9?3:4,rows=Math.ceil(n/cols),W=980,H=960,cell=Math.min(W/cols,H/rows),card=cell-18,ox=50+(W-cols*cell)/2,oy=262+(H-rows*cell)/2;
    for(let k=0;k<n;k++){const it=items[k],c=k%cols,r=Math.floor(k/cols),inRow=Math.min(cols,n-r*cols),cx=1080-ox-(c+1)*cell+9-(cols-inRow)*cell/2,cy=oy+r*cell+9;

    x.direction='ltr';x.textAlign='left';x.fillStyle='#7a1f4a';x.font='600 32px "Readex Pro", sans-serif';x.fillText('adeeb.club/taj'+(pages>1?`   ${p+1}/${pages}`:''),60,1294);
    const blob=await new Promise(r=>cv.toBlob(r,'image/png'));const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`tijan-adeeb-${p+1}.png`;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);await new Promise(r=>setTimeout(r,400))}
  }finally{b.textContent=lbl;b.disabled=false}}
